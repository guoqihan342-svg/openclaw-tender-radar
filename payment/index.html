<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订阅付款 - OpenClaw 招标雷达</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .plan-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        .plan-name {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        .plan-price {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }
        .plan-price span {
            font-size: 16px;
            color: #999;
        }
        .plan-desc {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .payment-options {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }
        .payment-option {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        .payment-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .payment-option h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
        }
        .qr-code {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }
        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .payment-hint {
            font-size: 12px;
            color: #999;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }
        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 14px;
        }
        .instructions {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .instructions h4 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .instructions ol {
            color: #856404;
            font-size: 13px;
            padding-left: 20px;
        }
        .instructions li {
            margin-bottom: 5px;
        }
        .contact-info {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .contact-info p {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .contact-method {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-decoration: none;
        }
        .security-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .security-note::before {
            content: '🔒 ';
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 OpenClaw 招标雷达</h1>
            <p>选择套餐，扫码付款，立即开通</p>
        </div>

        <div class="plan-info">
            <div class="plan-name">⭐ 标准版订阅</div>
            <div class="plan-price">¥99<span>/月</span></div>
            <div class="plan-desc">每日10条精选招标 + 每周深度报告</div>
        </div>

        <div class="instructions">
            <h4>📋 付款步骤</h4>
            <ol>
                <li>选择下方微信或支付宝，扫码付款 ¥99</li>
                <li>截图保存付款成功页面</li>
                <li>添加客服微信，发送截图</li>
                <li>客服确认后，立即开通服务</li>
            </ol>
        </div>

        <div class="payment-options">
            <div class="payment-option">
                <h3>💚 微信支付</h3>
                <div class="qr-code">
                    <img src="wechat-qr.png" alt="微信收款码" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'padding:80px 20px; color:#999;\'>微信收款码<br>加载中...</div>'">
                </div>
                <p class="payment-hint">打开微信 → 扫一扫 → 完成支付</p>
            </div>

            <div class="divider"><span>或</span></div>

            <div class="payment-option">
                <h3>💙 支付宝</h3>
                <div class="qr-code">
                    <img src="alipay-qr.jpg" alt="支付宝收款码" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'padding:80px 20px; color:#999;\'>支付宝收款码<br>加载中...</div>'">
                </div>
                <p class="payment-hint">打开支付宝 → 扫一扫 → 完成支付</p>
            </div>
        </div>

        <div class="contact-info">
            <p>付款后请添加客服开通服务</p>
            <a href="#" class="contact-method">💬 联系客服开通</a>
        </div>

        <p class="security-note">安全支付 · 7天无理由退款 · 不满意全额退</p>
    </div>

    <script>
        // 简单的页面统计
        console.log('Payment page loaded');
        
        // 可以添加实际的客服联系方式
        document.querySelector('.contact-method').addEventListener('click', function(e) {
            e.preventDefault();
            alert('请添加客服微信：\n\n1. 扫码付款后截图\n2. 添加客服微信发送截图\n3. 客服确认后立即开通\n\n客服在线时间：9:00-21:00');
        });
    </script>
</body>
</html>
